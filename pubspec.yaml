name: despensa_smart
description: Despensa inteligente com recomendações de receitas baseadas nos ingredientes cadastrados.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  http: ^1.6.0
  shared_preferences: ^2.5.6
  cached_network_image: ^4.0.5
  flutter_local_notifications: ^22.3.2
  flutter_timezone: ^5.1.1
  timezone: ^0.11.2
  workmanager: ^0.10.10
  flutter_edge_ai: 2.5.4
  flutter_edge_ai_litertlm: 1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
  
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#175B45"
  adaptive_icon_foreground: "assets/app_icon_foreground.png"
  windows:
    generate: true
    image_path: "assets/app_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/app_icon.png"
  web:
    generate: true
    image_path: "assets/app_icon.png"
    background_color: "#F8F7F2"
    theme_color: "#175B45"
