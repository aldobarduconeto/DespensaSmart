name: DespensaSmart - Flutter Multi-Platform Release

on:
  push:
    tags:
      - 'v1.0.0'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: build-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Gerar instalador com Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --version=6.4.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $visualStudio = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $visualStudio) { throw 'Visual Studio com ferramentas C++ não encontrado.' }
          $crt = Get-ChildItem "$visualStudio\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory |
            Sort-Object { [version]$_.Parent.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $crt) { throw 'Runtime Visual C++ x64 não encontrado.' }
          Copy-Item -Path "$($crt.FullName)\*.dll" -Destination build\windows\x64\runner\Release
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -creplace '^v', ''
          } else {
            $versionLine = Select-String -Path pubspec.yaml -Pattern '^version:\s*([^\s+#]+)'
            if (-not $versionLine) { throw 'Versão ausente no pubspec.yaml.' }
            $version = $versionLine.Matches[0].Groups[1].Value
          }
          & $iscc "/DAppVersion=$version" windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: build-exe
          path: build/installer/DespensaSmart-Setup.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Gerar imagem de disco
        run: |
          staging="$(mktemp -d)"
          ditto build/macos/Build/Products/Release/despensa_smart.app "$staging/DespensaSmart.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname DespensaSmart -srcfolder "$staging" -format UDZO DespensaSmart.dmg
          hdiutil verify DespensaSmart.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: build-dmg
          path: DespensaSmart.dmg
          if-no-files-found: error

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compilar iOS sem assinatura
        run: flutter build ios --release --no-codesign
      - name: Empacotar IPA sem assinatura
        shell: bash
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          trap 'rm -rf "$staging"' EXIT
          mkdir -p "$staging/Payload" build/ios/ipa
          ditto build/ios/iphoneos/Runner.app "$staging/Payload/Runner.app"
          ipa="$PWD/build/ios/ipa/DespensaSmart-unsigned.ipa"
          ditto -c -k --keepParent "$staging/Payload" "$ipa"
          unzip -tq "$ipa" Payload/Runner.app/Info.plist
      - uses: actions/upload-artifact@v4
        with:
          name: build-ipa
          path: build/ios/ipa/DespensaSmart-unsigned.ipa
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Instalar dependências do Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Gerar pacote Debian
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          fi
          dpkg --validate-version "$version"
          arch="$(dpkg --print-architecture)"
          staging="$(mktemp -d)"
          trap 'rm -rf "$staging"' EXIT

          install -d "$staging/DEBIAN" "$staging/opt/despensa-smart"
          cp -a build/linux/x64/release/bundle/. "$staging/opt/despensa-smart/"
          test -x "$staging/opt/despensa-smart/despensa_smart"
          install -d "$staging/usr/bin"
          ln -s /opt/despensa-smart/despensa_smart "$staging/usr/bin/despensa-smart"
          install -Dm644 assets/app_icon.png "$staging/usr/share/pixmaps/despensa-smart.png"
          install -d "$staging/usr/share/applications"

          cat > "$staging/usr/share/applications/despensa-smart.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=DespensaSmart
          Exec=despensa-smart
          Icon=despensa-smart
          Terminal=false
          Categories=Utility;
          EOF

          cat > "$staging/DEBIAN/control" <<EOF
          Package: despensa-smart
          Version: $version
          Architecture: $arch
          Maintainer: DespensaSmart
          Section: utils
          Priority: optional
          Depends: libc6 (>= 2.39), libstdc++6, libgtk-3-0t64 | libgtk-3-0
          Description: Gerenciador de despensa com sugestões de receitas
          EOF

          mkdir -p build/deb
          package="build/deb/despensa-smart_${version}_${arch}.deb"
          dpkg-deb --root-owner-group --build "$staging" "$package"
          dpkg-deb --info "$package"
      - uses: actions/upload-artifact@v4
        with:
          name: build-deb
          path: build/deb/*.deb
          if-no-files-found: error

  create-release:
    if: github.ref_type == 'tag'
    needs: [build-android, build-windows, build-macos, build-ios, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/build-apk/*.apk
            artifacts/build-exe/*.exe
            artifacts/build-dmg/*.dmg
            artifacts/build-ipa/*.ipa
            artifacts/build-deb/*.deb
          fail_on_unmatched_files: true
          generate_release_notes: true
